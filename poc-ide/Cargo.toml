[package]
name = "poc-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "POC IDE consumer sample: folder/file, tree, tabs, buffers, syntect, disk conflict, stock LSP, protocol console"

[lib]
name = "poc_ide"
path = "src/lib.rs"

[[bin]]
name = "poc-ide"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
progressive-lsp-control.workspace = true
lsp-types = "0.97.0"
eframe = "=0.36.1"
egui = "=0.36.1"
egui_extras = "=0.36.1"
rfd = "=0.15.4"
ropey = "1.6.1"
syntect = "5.3.0"
arboard = "3.6.1"
notify = "8.2.0"

[dev-dependencies]
tempfile.workspace = true

# eframe / rfd live in main.rs and ui.rs; mutants score Ports/Commands only.
[package.metadata.mutants]
exclude_globs = ["src/main.rs", "src/ui.rs"]
