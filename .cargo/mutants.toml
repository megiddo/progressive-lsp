# cargo-mutants: listed library crates only (docs/testing.md).
# Language crates with real resolvers: java, php, html, css, javascript, go, zig, python, rust, c, cpp, csharp.
# Also progressive-lsp-script and progressive-lsp-engine (supervisor/crash/backoff/hash/discovery).
# poc-ide from IDE-1: Ports / Commands / value objects — not eframe (`src/main.rs`, `src/ui.rs`).

# EmptyIndex already returns empty; `vec![]` replacements are equivalent.
# poc-ide eframe composition root is not mutation-tested (docs/testing.md).
exclude_globs = [
    "poc-ide/src/main.rs",
    "poc-ide/src/ui.rs",
]
exclude_re = [
    "impl GraphIndex for crate::query::EmptyIndex",
    "impl crate::tree_sitter::SymbolIndex for EmptyIndex",
    # Linux-only; not compiled on Darwin host mutants.
    "fn linux_vm_rss_bytes",
    # Fetch-at-SHA / bake-off (network + long); not a unit invariant.
    "fetch_git_sha",
    "fetch_junit4",
    "t2_bakeoff_records_heuristic_and_attempts_tsg",
    "copy_tree",
    # Optional --features t2-stack-graphs runtime (not in default tests).
    "tsg_runtime",
    # Clamp at the exact min/max: `<` vs `<=` and `>` vs `>=` are equivalent
    # because the boundary value is already the clamped result.
    "replace < with <= in clamp_left_width",
    "replace > with >= in clamp_left_width",
    # Position/byte helpers (same class as test line_col).
    "ident_at",
    "find_decl",
    "range_of_byte",
    "is_ident_byte",
    # progressive-lsp-log: test-only readers and Actor loop predicates (LOG-2+).
    "compile_options_contain_omit_load_extension",
    "load_extension_sql_is_omitted",
    "fn journal_mode",
    "fn read_messages",
    "fn read_levels",
    "fn read_operations",
    "fn index_names",
    "fn row_count",
    "Mailbox::recv_timeout",
    "Mailbox::try_push",
    "run_loop",
    "open_and_init",
    # Capture Adapter install / Visit fallbacks (LOG-3). Invariants are on emit.
    "try_install",
    "eprint_usage",
    "record_str",
    "fn record_debug",
    "fn record_f64",
    "fn record_i64",
    "fn record_u64",
    "fn record_bool",
    "fn record_error",
]
