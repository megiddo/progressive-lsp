[workspace]
resolver = "2"
members = [
    ".",
    "progressive-lsp-core",
    "progressive-lsp-plugin",
    "progressive-lsp-protocol",
    "progressive-lsp-control",
    "progressive-lsp-install",
    "progressive-lsp-watch",
    "progressive-lsp-index",
    "progressive-lsp-resolve",
    "progressive-lsp-workspace",
    "progressive-lsp-lang-java",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
progressive-lsp-core = { path = "progressive-lsp-core" }
progressive-lsp-plugin = { path = "progressive-lsp-plugin" }
progressive-lsp-protocol = { path = "progressive-lsp-protocol" }
progressive-lsp-control = { path = "progressive-lsp-control" }
progressive-lsp-install = { path = "progressive-lsp-install" }
progressive-lsp-watch = { path = "progressive-lsp-watch" }
progressive-lsp-index = { path = "progressive-lsp-index" }
progressive-lsp-resolve = { path = "progressive-lsp-resolve" }
progressive-lsp-workspace = { path = "progressive-lsp-workspace" }
progressive-lsp-lang-java = { path = "progressive-lsp-lang-java" }
prost = "0.13"
tree-sitter = "0.24"
tree-sitter-java = "0.23"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tempfile = "3.20"

[package]
name = "progressive-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composition root: serve + install"

[dependencies]
progressive-lsp-control.workspace = true
progressive-lsp-core.workspace = true
progressive-lsp-index.workspace = true
progressive-lsp-install.workspace = true
progressive-lsp-lang-java = { workspace = true, optional = true }
progressive-lsp-plugin.workspace = true
progressive-lsp-protocol.workspace = true
progressive-lsp-resolve.workspace = true
progressive-lsp-watch.workspace = true
progressive-lsp-workspace.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true

[features]
default = ["lang-java"]
lang-java = ["dep:progressive-lsp-lang-java"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[[bin]]
name = "progressive-lsp"
path = "src/main.rs"
